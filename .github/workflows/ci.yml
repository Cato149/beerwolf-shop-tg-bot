name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
  # Manual run from the Actions tab; deploy still only runs on main.
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t beerwolf-shop:ci .

  deploy:
    name: Deploy to production
    needs: [lint-and-test, docker]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          APP_ENV: ${{ secrets.APP_ENV }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          envs: DEPLOY_PATH,APP_ENV
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git fetch origin main
            git checkout -B main origin/main
            DEPLOY_BRANCH=main ./scripts/deploy.sh
