[common]
start = 🐺 <b>{name}, you are tuned to Beerwolf</b>\n\nI build personal websites for furry identities — custom work, no templates, no agency maze.\n\nTap <b>New project</b> and send a short brief. I will review it and write back. Once work starts, open <b>My project</b> to follow every stage through to launch.
choose_language = 🌐 <b>Choose your signal language</b>\n\nYou can switch it from the menu at any time.
