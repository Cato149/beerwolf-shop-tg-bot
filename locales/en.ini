[order]
ask_name = 👋 <b>What should I call you?</b>\n\nA name or handle — whatever feels right.
ask_idea = ✦ <b>Tell me about the idea</b>\n\nWhat are we making, who is it for, and how should the finished thing feel?
ask_contacts = 📡 <b>Where can I reach you?</b>\n\nAdd Discord, email, or another contact if useful. You can skip this step.
ask_references = 🗂 <b>Show me the visual direction</b>\n\nSend artwork, links, screenshots, music, colors, or projects that feel close. Photos can arrive as separate messages. You can skip this step.
ask_budget = 🗓 <b>Any budget or timing in mind?</b>\n\nNo fixed range yet? Just skip this step.
confirm_preview = 🐾 <b>Check the trail before sending</b>\n\n<b>How to address you</b>\n{name}\n\n<b>Idea</b>\n{idea}\n\n<b>Contacts</b>\n{contacts}\n\n<b>References</b>\n{references}\n\n<b>Budget and timing</b>\n{budget}
photos_attached = 📎 Photos in the brief: {count}
photo_saved = Photo received. Send another or continue with text.
replace_application = You already have a fresh signal. Continuing will replace it unless the studio has started reviewing it.
submitted = ✅ <b>Signal received</b>\n\nI will review the brief and write back shortly. No agency maze — we take it from here together.
active_exists = You already have an active project. Open “My project” to see where it stands.
