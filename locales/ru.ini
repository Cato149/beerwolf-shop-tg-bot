[common]
start = 🐺 <b>{name}, вы на частоте Beerwolf</b>\n\nЗдесь начинается ваш личный веб-проект: оставьте заявку, а затем следите за каждым этапом без таинственной тишины.
choose_language = 🌐 <b>Выберите язык сигнала</b>\n\nЕго всегда можно сменить в меню.
language_changed = Русский сигнал настроен.
btn_new_order = Новый проект
btn_my_orders = Мои проекты
btn_my_order = Мой проект
