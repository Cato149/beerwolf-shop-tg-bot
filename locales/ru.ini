help = Отправьте /start, чтобы вернуться в главное меню.

[order]
ask_name = 👋 <b>Как к вам обращаться?</b>\n\nИмя или ник — как вам удобнее.
ask_idea = ✦ <b>Расскажите об идее</b>\n\nЧто мы создаём, для кого и какое ощущение должен оставлять результат?
ask_contacts = 📡 <b>Где с вами связаться?</b>\n\nМожно добавить Discord, email или другой удобный контакт. Этот шаг можно пропустить.
ask_references = 🗂 <b>Покажите визуальное направление</b>\n\nПришлите арты, ссылки, скриншоты, музыку, цвета или проекты, которые вам близки. Фото можно отправить отдельными сообщениями. Шаг можно пропустить.
ask_budget = 🗓 <b>Есть ориентир по бюджету или срокам?</b>\n\nЕсли пока нет — просто пропустите этот шаг.
confirm_preview = 🐾 <b>Проверим след перед отправкой</b>\n\n<b>Как обращаться</b>\n{name}\n\n<b>Идея</b>\n{idea}\n\n<b>Контакты</b>\n{contacts}\n\n<b>Референсы</b>\n{references}\n\n<b>Бюджет и сроки</b>\n{budget}
photos_attached = 📎 Фото в заявке: {count}
photo_saved = Фото поймано. Можно прислать ещё или продолжить текстом.
replace_application = У вас уже есть новый сигнал. Если продолжить, текущая заявка будет заменена — пока студия не взяла её в работу.
submitted = ✅ <b>Сигнал принят</b>\n\nЯ посмотрю заявку и напишу после короткой проверки. Никакой агентской путаницы — дальше общаемся напрямую.
active_exists = У вас уже есть проект в работе. Откройте «Мой проект», чтобы увидеть его состояние.
